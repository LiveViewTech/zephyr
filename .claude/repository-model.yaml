analysis:
  purpose:
    value: "Scalable RTOS for resource-constrained devices across many architectures and boards, with security-minded kernel and a west-managed module ecosystem."
    confidence: high
    evidence_refs:
      - entry-readme
      - entry-west-manifest
      - comp-kernel
      - fw-west
  architecture:
    value: "Applications are out-of-tree or under samples/tests and invoke find_package(Zephyr); CMake pulls kernel, arch/soc/board, drivers, and selected subsys via Kconfig/devicetree. west.yml fetches external modules. Twister discovers tests.yaml suites and builds/runs them on boards or simulators."
    confidence: high
    evidence_refs:
      - entry-cmake-root
      - entry-hello-world
      - entry-west-manifest
      - fw-cmake
      - fw-twister
      - comp-kernel
      - comp-drivers
      - comp-subsys
      - comp-boards
      - comp-dts
  patterns:
    - id: pat-west-workspace
      value: "Build and module fetch require a west workspace; root CMakeLists.txt is not an application entry and errors if invoked as the app source dir."
      confidence: high
      evidence_refs:
        - entry-cmake-root
        - entry-west-manifest
        - cmd-west-update
        - cmd-west-build
    - id: pat-kconfig-dts
      value: "Feature selection is Kconfig-driven; hardware description is DeviceTree under dts/ and boards/; drivers/subsys gated with add_subdirectory_ifdef(CONFIG_*)."
      confidence: high
      evidence_refs:
        - entry-kconfig
        - comp-dts
        - comp-drivers
        - comp-subsys
    - id: pat-sample-as-app
      value: "Canonical app shape is samples/*/CMakeLists.txt with find_package(Zephyr) and target_sources(app ...); hello_world is the smoke sample."
      confidence: high
      evidence_refs:
        - entry-hello-world
        - comp-samples
        - cmd-west-build
    - id: pat-twister-discovery
      value: "Twister discovers test/sample scenarios via tests.yaml (and related metadata) and is the primary CI harness (west twister / scripts/twister)."
      confidence: high
      evidence_refs:
        - entry-twister
        - test-twister
        - cmd-west-twister
        - comp-tests
    - id: pat-commit-subsystem-prefix
      value: "Contributions expect DCO Signed-off-by; CI checks commit formatting; gitlint config enforces subsystem-prefixed titles."
      confidence: high
      evidence_refs:
        - entry-contributing
  component_notes:
    - ref: comp-kernel
      purpose: "Core RTOS services (threads, scheduling, sync, memory, init); provides weak main if the app omits one."
      confidence: high
    - ref: comp-drivers
      purpose: "Device driver implementations selected by Kconfig; large vendor/peripheral surface."
      confidence: high
    - ref: comp-subsys
      purpose: "Higher-level subsystems (Bluetooth, networking, FS, logging, PM, ztest harness, etc.) composed into images via Kconfig."
      confidence: high
    - ref: comp-arch
      purpose: "Architecture ports (ARM, RISC-V, x86, Xtensa, ARC, ...) and arch-specific boot/exception code."
      confidence: high
    - ref: comp-boards
      purpose: "Board definitions (devicetree, Kconfig, board.yml) consumed as west build -b targets."
      confidence: high
    - ref: comp-soc
      purpose: "SoC-level support packages bridging arch and board hardware description."
      confidence: high
    - ref: comp-dts
      purpose: "Shared DeviceTree includes and YAML bindings that generate device configuration at build time."
      confidence: high
    - ref: comp-include
      purpose: "Public C API headers under include/zephyr/ (kernel, drivers, subsystems)."
      confidence: high
    - ref: comp-scripts
      purpose: "West extensions, twister, Kconfig/DTS tooling, compliance helpers, and Python requirements."
      confidence: high
    - ref: comp-tests
      purpose: "In-tree verification suites for twister/ztest/bsim across kernel, drivers, and subsystems."
      confidence: high
    - ref: comp-samples
      purpose: "Example applications demonstrating APIs and serving as CI/build smoke targets."
      confidence: high
    - ref: comp-doc
      purpose: "Sphinx documentation tree (getting started, APIs, contribute guides)."
      confidence: high
    - ref: comp-cmake
      purpose: "CMake modules, toolchain, linker, and package helpers used by the Zephyr build system."
      confidence: high
    - ref: comp-modules
      purpose: "Integration glue for west-fetched external modules (HALs, crypto, FS, TF-M, etc.)."
      confidence: high
    - ref: comp-lib
      purpose: "Support libraries (libc helpers, OS utilities such as printk, heaps, SMF)."
      confidence: high
  service_notes:
    - ref: svc-github-actions
      purpose: "CI for twister, compliance, docs, bsim, and related checks on PRs and main."
      integration: "Workflows under .github/workflows invoke west update, west twister, and pytest against scripts."
      confidence: high
    - ref: svc-zephyr-docs
      purpose: "Published upstream documentation referenced by README and getting started."
      integration: "Links from README.rst; local docs built from doc/ via Sphinx."
      confidence: high
    - ref: svc-discord
      purpose: "Community realtime chat linked from README."
      confidence: high
    - ref: svc-mailing-lists
      purpose: "users/devel mailing lists for community support and development discussion."
      confidence: high
  dangerous_areas:
    - id: danger-cmake-as-app
      value: "Invoking CMake with the Zephyr tree root as the application source directory"
      reason: "CMakeLists.txt fatals unless ZEPHYR_BINARY_DIR is set from an application build; apps must live under samples/tests or out-of-tree with find_package(Zephyr)."
      confidence: high
      evidence_refs:
        - entry-cmake-root
        - entry-hello-world
    - id: danger-west-modules
      value: "Building without a completed west update / module checkout"
      reason: "west.yml pulls large external trees (HALs, mcuboot, mbedtls, TF-M, bsim). Missing modules break boards/drivers that depend on them."
      confidence: high
      evidence_refs:
        - entry-west-manifest
        - dep-mcuboot
        - dep-mbedtls
        - cmd-west-update
        - comp-modules
    - id: danger-board-target-syntax
      value: "Board target naming for multi-core / multi-SoC boards"
      reason: "west build -b often needs SoC/CPU cluster qualifiers (e.g. nrf5340dk/nrf5340/cpuapp); wrong target yields wrong image or configure failure."
      confidence: high
      evidence_refs:
        - cmd-west-build
        - comp-boards
    - id: danger-maintainers-surface
      value: "Touching code without consulting MAINTAINERS.yml ownership"
      reason: "Huge multi-maintainer tree; area-specific review expectations are encoded in MAINTAINERS.yml and get_maintainer.py."
      confidence: high
      evidence_refs:
        - entry-maintainers
        - comp-drivers
        - comp-subsys
  questions:
    - id: q-lvt-fork-divergence
      question: "This remote is LiveViewTech/zephyr while west.yml and docs describe upstream zephyrproject-rtos. What intentional fork divergences (if any) should agents treat as authoritative vs upstream?"
      area: ownership
      priority: high
      evidence_refs:
        - entry-west-manifest
    - id: q-optional-modules-default
      question: "Default west group-filter disables babblesim/optional/testing groups — when must contributors enable them for local work?"
      area: build
      priority: medium
      evidence_refs:
        - entry-west-manifest
        - test-bsim
